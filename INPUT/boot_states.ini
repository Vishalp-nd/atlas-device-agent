; Boot state rules: how the Log Analyzer tells, from the logs, what state a device was in
; during a boot. Tests declare the states they need with
;     @pytest.mark.boot_state(power="ignition_off", link=("lte", "lte_wifi"))
; and are only judged on the parts of a boot where every named dimension had one of
; the listed values (see lib/boot_states.py). A dimension a test leaves out does not matter.
;
; Format: one section per dimension; each line is
;     <value> = <service> | <grep basic regex, matched case-insensitively like search_log>
; A matching line puts the dimension in <value> from its timestamp until a line of another
; value of the same dimension. A value may have several lines; a value with no line is
; allowed (it is known to the markers but not detected yet: tests needing it are judged as
; before, never filtered on it). "default = <value>" is the state at every boot start;
; "once = <value>, ..." makes only the first line of those values in a boot count (one-time events).
;
; These lines are searched in the same grep pass as the test steps: no extra read of the logs.
; Confirmed against device 103182502310 (bagheera3) logs unless marked "unconfirmed".

[power]
ignition_on = ndcentral | IGNITION ON received
ignition_off = ndcentral | IGNITION OFF received
; A boot woken from low power mode logs a non-zero wakeup counter early on
lpm = power_mon | POWER_MONITOR_ctx->lowpower_wakeups [1-9]
; Woken by motion only: the boot's wakeup reason event (code 40105), e.g.
;   WAKEUP_REASON::POWER_UP:WAKEonMOTION_AON -- RESET_REASON::...
; "POWER_UP:IGNITION:WAKEonMOTION_AON" (ignition woke it too) is not WOM; the state lasts
; until IGNITION ON received
; apm logs it ~8 s into the boot (and again later), health ~30 s: only the first line counts ("once"),
; else a later copy would put the boot back in WOM after IGNITION ON received
once = wom
; (both files kept: either may be missing)
wom = apm | WAKEUP_REASON:[: ]*\(POWER_UP:\)\?WAKE_\?ON_\?MOTION
wom = health | WAKEUP_REASON:[: ]*\(POWER_UP:\)\?WAKE_\?ON_\?MOTION

[motion]
idle = ndcentral | Idle update received from speed - Vehicle idle detected
moving = ndcentral | Idle update received from speed - Vehicle 'out of idle' detected

[gps]
; "GPS Lock Acquired" is not logged in every boot: a fix quality above 0 (logged about every second) also means valid.
; "GPS Fix Quality : 0" is not used: it comes with every "Ignoring invalid GPS data" line.
valid = gps | GPS Lock Acquired
valid = gps | GPS Fix Quality : [1-9]
no_gps = gps | GPS Lock Lost
invalid = gps | Ignoring invalid GPS data

[roaming]
yes = conn_mgr | roaming_status = 1
no = conn_mgr | roaming_status = 0

; ── primitive dimensions behind link / network (lib/boot_states.py DERIVED) ──
; link: lte, wifi, lte_wifi, none        (from lte + wifi)
; network: proper, poor, none            (from internet + signal)

[lte]
up = conn_mgr | Radio Interface *:LTE
down = conn_mgr | LTE connectivity do not exist

[wifi]
default = down
up = wifi_mgr | state transition: \[[A-Z]*\] -> \[MONITORING\]
down = wifi_mgr | state transition: \[MONITORING\] -> \[IDLE\]
down = wifi_mgr | state transition: \[MONITORING\] -> \[STOPPED\]
down = wifi_mgr | Wifi disconnected

[internet]
pass = conn_mgr | DNS resolution result: PASS
fail = conn_mgr | DNS resolution result: FAIL
fail = conn_mgr | No internet connectivity

; LTE RSRP: -105 dBm or weaker is poor
[signal]
good = conn_mgr | LTE - RSRP *:-[1-9][0-9]\?$
good = conn_mgr | LTE - RSRP *:-10[0-4]$
poor = conn_mgr | LTE - RSRP *:-10[5-9]$
poor = conn_mgr | LTE - RSRP *:-1[1-9][0-9]$
